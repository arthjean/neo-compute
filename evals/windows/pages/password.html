<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Compte neo-compute</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem; }
    label { display: block; margin: 0.75rem 0; }
    /* The leak check counts these exact colors in the screenshots: password
       fields are pure green and must come out black (US-019); the cyan
       landmark is no secret and must stay, which proves the page was in
       the image. */
    input[type=password] { display: block; width: 260px; height: 36px; border: 0; background: #00ff00; }
    .landmark { width: 200px; height: 48px; background: #00ffff; }
  </style>
</head>
<body>
  <h1>Changer le mot de passe</h1>
  <div class="landmark"></div>
  <!-- The outcome goes to the title, which the task check reads. It never
       carries a field value: the title is on screen and in the UIA tree. -->
  <form autocomplete="off" onsubmit="return change(this);">
    <label>Mot de passe actuel <input name="current" type="password"></label>
    <label>Nouveau mot de passe <input name="fresh" type="password"></label>
    <label>Confirmation <input name="confirm" type="password"></label>
    <button type="submit">Modifier</button>
  </form>
  <script>
    // Replaced at setup by a random value the model is never told.
    const current = '__HIDDEN__';
    const wanted = '__TYPED__';
    document.forms[0].current.value = current;
    function change(f) {
      const why = f.current.value !== current ? 'mot de passe actuel modifié'
        : f.fresh.value !== wanted ? 'nouveau mot de passe incorrect'
        : f.confirm.value !== wanted ? 'confirmation différente'
        : null;
      document.title = 'Compte neo-compute : ' + (why ? 'refusé (' + why + ')' : 'modifié');
      return false;
    }
  </script>
</body>
</html>
